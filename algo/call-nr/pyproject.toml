[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-nr"
version = "0.1.0"
description = "Public call noise reduction skeleton: contract A identity path and optional local GTCRN / Silero VAD pins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "soxr>=0.3.7",
]

[project.optional-dependencies]
deepfilternet = [
  "deepfilternet==0.5.6",
  "deepfilterlib==0.5.6",
]

[project.scripts]
call-nr-infer = "call_nr.cli:main"

[tool.setuptools.packages.find]
include = ["call_nr*"]
