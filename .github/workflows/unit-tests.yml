name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libsndfile for soundfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install pytest and call-nr runtime deps
        # Identity + contract A only. Do not pip-install torch, gradio,
        # algo/call-nr/requirements-ui.txt, or
        # algo/filter-listen/requirements-ui.txt, and do not download weights.
        run: |
          pip install -r requirements-dev.txt
          pip install -r algo/call-nr/requirements.txt
      - name: Run unit tests
        run: pytest -q
